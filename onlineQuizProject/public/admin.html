<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
        }

        header {
            background: #172554;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header a {
            color: white;
            text-decoration: none;
            background: #ef4444;
            padding: 10px 18px;
            border-radius: 5px;
        }

        .container {
            padding: 35px;
        }

        h2 {
            color: #172554;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000012;
            text-align: center;
        }

        .card h3 {
            color: #555;
            margin-bottom: 15px;
        }

        .card h1 {
            color: #4338ca;
            font-size: 32px;
        }

        .actions {
            margin-top: 40px;
        }

        .actions h2 {
            margin-bottom: 20px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .buttons a {
            background: #1e3a8a;
            color: white;
            text-decoration: none;
            padding: 15px 25px;
            border-radius: 6px;
        }

        .buttons a:hover {
            background: #4338ca;
        }

        footer {
            margin-top: 60px;
            background: #172554;
            color: white;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

    <header>
        <h2 style="color:white; margin:0;">Admin Dashboard</h2>
        <a href="index.html">Logout</a>
    </header>

    <div class="container">

        <h2>Welcome, Admin!</h2>

        <div class="cards">

            <div class="card">
                <h3>Total Students</h3>
                <h1>120</h1>
            </div>

            <div class="card">
                <h3>Total Quizzes</h3>
                <h1>15</h1>
            </div>

            <div class="card">
                <h3>Total Questions</h3>
                <h1>75</h1>
            </div>

            <div class="card">
                <h3>Total Results</h3>
                <h1>95</h1>
            </div>

        </div>

        <div class="actions">

            <h2>Manage Examination</h2>

            <div class="buttons">

                <a href="add-quiz.html">Add Quiz</a>

                <a href="add-questions.html">Add Questions</a>

                <a href="view-students.html">View Students</a>

                <a href="view-results.html">View Results</a>

            </div>

        </div>

    </div>

    <footer>
        <p>Online Quiz Examination Management System</p>
    </footer>

</body>
</html>
